- question: "Do Norway and Iceland use the same base year for their 2035 targets?"
  expected_answer: "No — Norway uses 1990 and Iceland uses 2005"
  expected_sources: ["Norways NDC for 2035..pdf", "Iceland's 2035 NDC.pdf"]
  out_of_corpus: false
  source_text: "Norway: 'compared to 1990 levels'. Iceland: 'by 2035 compared to 2005'."

- question: "Whose 2035 target is more ambitious, Norway's or Azerbaijan's?"
  expected_answer: "Norway's, at 70-75% against Azerbaijan's 40%"
  expected_sources: ["Norways NDC for 2035..pdf", "NDC 3.0 Report_Azerbaijan.pdf"]
  out_of_corpus: false
  source_text: "Norway: at least 70-75 per cent vs 1990. Azerbaijan: 40% by 2035 vs 1990."

- question: "How do Korea's and Georgia's 2035 targets compare?"
  expected_answer: "Korea 53-61% against 2018; Georgia 50% against 1990"
  expected_sources: ["The Republic of Koreas 2035 NDC.pdf", "NDC_3.0_Georgia_EN.pdf"]
  out_of_corpus: false
  source_text: "Korea: 53 to 61% ... compared to the 2018 level. Georgia: extended target of 50% by 2035 (below 1990 levels)."

- question: "Which countries in these documents measure their targets against 1990?"
  expected_answer: "Norway, Georgia, Azerbaijan and the EU"
  expected_sources: ["Norways NDC for 2035..pdf", "NDC_3.0_Georgia_EN.pdf", "NDC 3.0 Report_Azerbaijan.pdf", "DK-2025-11-05 EU NDC.pdf"]
  out_of_corpus: false
  source_text: "Four separate documents each state a 1990 baseline."

