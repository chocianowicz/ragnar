# Golden set for the currently indexed corpus (climate NDCs + EU CBAM).
#
# ── STATUS: DRAFTED, NOT YET VERIFIED ────────────────────────────────────
# Every expected_answer below was read out of the indexed document text and
# the passage it came from is recorded in `source_text`. Nothing here is
# invented. But it has not been checked by a human, and a golden set with a
# wrong answer in it is worse than a small one: it punishes correct
# behaviour and rewards the matching mistake. Work through it, correct what
# is wrong, delete what you disagree with, then remove this banner.
#
# ── WHAT THIS MEASURES, AND WHAT IT DOES NOT ─────────────────────────────
# This corpus is a stand-in. The real one is prose — contracts and policies
# — and a golden set written against it will disagree with this one about
# what matters. Treat these numbers as a regression baseline for changes to
# chunking, retrieval and the floor, not as a statement about how the tool
# performs on the documents it is actually for.
#
# ── SCHEMA ───────────────────────────────────────────────────────────────
#   question:        one turn          } exactly one of these
#   turns:           a follow-up chain } (only the last turn is scored)
#   expected_answer: what a correct answer must contain
#   expected_sources: filenames the citation must name
#   out_of_corpus:   the answer is not in the documents -> must refuse
#   expect_refusal:  must refuse even though it is in-corpus (aggregation)
#   source_text:     the passage the answer was read from — for your review
#
# Run:  python eval/run_eval.py --golden eval/golden_set.real.yaml
#       python eval/run_eval.py --golden eval/golden_set.real.yaml --calibrate

# ═══════════════════════════════════════════════════════════════════
# In-corpus, prose — the main case
# ═══════════════════════════════════════════════════════════════════

- question: "What is Norway's emission reduction target for 2035?"
  expected_answer: "at least 70-75 per cent compared to 1990 levels"
  expected_sources: ["Norways NDC for 2035..pdf"]
  out_of_corpus: false
  source_text: "Norway's Nationally Determined Contribution (NDC) for 2035 is to reduce greenhouse gas emissions by at least 70-75 per cent compared to 1990 levels."

- question: "What is the Republic of Korea's 2035 NDC target?"
  expected_answer: "53 to 61% reduction in net GHG emissions by 2035 compared to the 2018 level"
  expected_sources: ["The Republic of Koreas 2035 NDC.pdf"]
  out_of_corpus: false
  source_text: "the Republic of Korea's 2035 NDC sets a target at 53 to 61% reduction in net GHG emissions by 2035 compared to the 2018 level (742.3 MtCO2eq)."

- question: "What were Korea's emissions in its base year?"
  expected_answer: "742.3 MtCO2eq"
  expected_sources: ["The Republic of Koreas 2035 NDC.pdf"]
  out_of_corpus: false
  source_text: "compared to the 2018 level (742.3 MtCO2eq)"

- question: "What was Korea's 2030 NDC target?"
  expected_answer: "40% from the 2018 level"
  expected_sources: ["The Republic of Koreas 2035 NDC.pdf"]
  out_of_corpus: false
  source_text: "its enhanced update of the 2030 NDC which sets an ambitious target of reducing national GHG emissions by 40% from the 2018 level."

- question: "What is Iceland's 2035 target for the sectors covered by the Effort Sharing Regulation?"
  expected_answer: "50-55 per cent net reduction by 2035 compared to 2005"
  expected_sources: ["Iceland's 2035 NDC.pdf"]
  out_of_corpus: false
  source_text: "Iceland is committed to a target of 50-55 per cent net reduction of greenhouse gas emissions by 2035 compared to 2005, in the sectors covered by the scope of the EU's Effort Sharing Regulation (ESR)"

- question: "When was Iceland's 2035 NDC communicated to the UNFCCC?"
  expected_answer: "30 September 2025"
  expected_sources: ["Iceland's 2035 NDC.pdf"]
  out_of_corpus: false
  source_text: "Iceland's 2035 Nationally Determined Contribution (NDC). Communicated to the UNFCCC on 30 September 2025"

- question: "What is Iceland's LULUCF target?"
  expected_answer: "400-500 kt CO2 net reduction by 2035 compared to 2025"
  expected_sources: ["Iceland's 2035 NDC.pdf"]
  out_of_corpus: false
  source_text: "LULUCF: Iceland is committed to a target of 400-500 kt CO2 per cent net reduction of greenhouse gas emissions from the LULUCF sector by 2035 compared to 2025."

- question: "What is Georgia's greenhouse gas target for 2030?"
  expected_answer: "47% below 1990 levels"
  expected_sources: ["NDC_3.0_Georgia_EN.pdf"]
  out_of_corpus: false
  source_text: "Georgia is fully committed to limit total net greenhouse gas emissions by 47% below 1990 levels by 2030, with an extended target of 50% by 2035"

- question: "By how much does Georgia intend to cut emissions from energy generation and supply by 2030?"
  expected_answer: "15% compared to the without measure (WOM) scenario"
  expected_sources: ["NDC_3.0_Georgia_EN.pdf"]
  out_of_corpus: false
  source_text: "By 2030, the country intends to cut emissions from energy generation and supply by 15%, compared to the without measure (WOM) scenario, described in BTR."

- question: "What emissions reduction is Azerbaijan aiming for by 2035?"
  expected_answer: "40% compared to 1990"
  expected_sources: ["NDC 3.0 Report_Azerbaijan.pdf"]
  out_of_corpus: false
  source_text: "The country aims to achieve 40% emissions reduction by 2035, compared to 1990, setting a transformative and highly ambitious target."

- question: "What is the EU's 2030 emissions reduction target?"
  expected_answer: "at least 55% net domestic reduction compared to 1990"
  expected_sources: ["DK-2025-11-05 EU NDC.pdf"]
  out_of_corpus: false
  source_text: "a net domestic reduction of at least 55% in GHG emissions by 2030 compared to 1990"

- question: "By how much will India reduce the emissions intensity of its GDP by 2035?"
  expected_answer: "47 percent from the 2005 level"
  expected_sources: ["INDIA NDC 2031-35.pdf"]
  out_of_corpus: false
  source_text: "To reduce Emissions Intensity of its GDP by 47 percent by 2035, from 2005 level."

- question: "What share of historical global greenhouse gas emissions is Timor-Leste responsible for?"
  expected_answer: "0.003%"
  expected_sources: ["Timor-Leste Updated NDC 3.0.pdf"]
  out_of_corpus: false
  source_text: "Having responsibility for just 0.003 % of historical global greenhouse gas emissions, Timor-Leste commits to continue developing through sustainable"

- question: "How much of Guyana's national territory is covered by forest?"
  expected_answer: "approximately 85 percent"
  expected_sources: ["Guyanas NDC 2025-2035 V2.pdf"]
  out_of_corpus: false
  source_text: "maintaining one of the world's largest remaining intact tropical forest ecosystems, covering approximately 85 percent of the national territory"

- question: "How much carbon do Guyana's forests store?"
  expected_answer: "more than 21 billion tonnes of carbon dioxide equivalent"
  expected_sources: ["Guyanas NDC 2025-2035 V2.pdf"]
  out_of_corpus: false
  source_text: "These forests store more than 21 billion tonnes of carbon dioxide equivalent"

- question: "Which year does Saudi Arabia use as the base year for its second NDC?"
  expected_answer: "2019"
  expected_sources: ["2nd KSA NDC Document Final Document (28122025)_DNA.pdf"]
  out_of_corpus: false
  source_text: "on the basis of a dynamic baseline, with the year 2019 designated as the base year for this NDC."

- question: "What did Indonesia pledge in its Intended NDC in 2015?"
  expected_answer: "29% through domestic efforts, up to 41% with international support, compared to business as usual"
  expected_sources: ["Indonesia_Second NDC_2025.10.24.pdf"]
  out_of_corpus: false
  source_text: "the submission of the Intended NDC in 2015, which pledged emissions reduction of 29% through domestic efforts (unconditional) and up to 41% with international support (conditional) compared to BAU"

