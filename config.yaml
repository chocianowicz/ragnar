models:
  llm: qwen2.5:14b
  embedding: bge-m3
  embedding_dim: 1024
  reranker: BAAI/bge-reranker-v2-m3
  # Token window per rerank pair. The model accepts 8192 and
  # sentence-transformers defaults to that; chunks target 500, so
  # scoring at 8192 was ~4.5x slower for nothing.
  reranker_max_length: 512
  # Texts per /api/embed request. Ingestion embeds a whole document at
  # once, so this is what keeps a large PDF from riding on one timeout.
  embedding_batch: 64
  # How long Ollama holds a model after the last call. Memory against
  # latency, and the memory is not small: qwen2.5:14b is ~14 GB resident,
  # on a machine also running Docker and Qdrant. Lower it (or "0") on a
  # constrained machine and pay a cold load on the first question after a
  # pause; raise it if the machine has room to spare.
  keep_alive: 10m

chunking:
  strategy: structural   # fixed | structural
  target_tokens: 500
  overlap_tokens: 50
  table_rows_per_group: 20

retrieval:
  candidates: 25
  top_k: 5
  # Calibrated 2026-09-24 on the 222-case golden set (--calibrate
  # --retrieval-only --multi-query, GPU reranker). No floor had a flat
  # stretch of low missed refusals; 0.62-0.63 is the first plateau where
  # missed drops (0.49 -> 0.31) while refusal accuracy (0.815) stays inside
  # the best floor's 95% range. Scores are sigmoid(probability):
  # CrossEncoder.predict already applies a sigmoid and BGEReranker.rerank
  # applies another, so 0.62 here is a cross-encoder probability of ~0.49.
  score_floor: 0.62
  # Pair the dense embedding with a lexical (sparse) one and fuse the two
  # by reciprocal rank. Dense vectors are poor at exact identifiers - a
  # CN code in a large reference table ranked 291st without this. Applies
  # to collections created from now on; an older collection cannot have a
  # sparse vector added in place, see `python -m retrieval.migrate`.
  hybrid: true

storage:
  data_dir: /app/data
  collection: documents_hybrid
  # Points per Qdrant upsert request, for the same reason.
  upsert_batch: 128

# Extra retrieval stages, all off by default. Each costs at least one LLM
# call before the answer starts, on a question where reranking already
# dominates. Turn them on per question in Settings and watch the trace -
# "How this answer was found" reports how many calls each question made.
agentic:
  # Which stages run is not set here. They are per-instance choices made in
  # Settings -> advanced and stored in data/settings.json, so a key here
  # would be read by nothing and contradict the running app. Only the two
  # values below shape a stage once it is on.
  max_hops: 2             # extra searches when a first pass comes back thin
  variants: 3             # alternative phrasings searched beside the original
