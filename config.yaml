models:
  llm: qwen2.5:14b
  embedding: bge-m3
  embedding_dim: 1024
  reranker: BAAI/bge-reranker-v2-m3
  # Token window per rerank pair. The model accepts 8192 and
  # sentence-transformers defaults to that; chunks target 500, so
  # scoring at 8192 was ~4.5x slower for nothing.
  reranker_max_length: 512
  # Texts per /api/embed request. Ingestion embeds a whole document at
  # once, so this is what keeps a large PDF from riding on one timeout.
  embedding_batch: 64

chunking:
  strategy: structural   # fixed | structural
  target_tokens: 500
  overlap_tokens: 50
  table_rows_per_group: 20

retrieval:
  candidates: 25
  top_k: 5
  # Was 0.6 from Task 25's calibration (only 5 golden-set cases, explicitly
  # flagged there as not production-trustworthy). Real usage against a real
  # uploaded corpus showed a clean gap: out-of-corpus questions scored
  # 0.50-0.503, relevant ones (even a single vague word) scored 0.578+.
  # 0.55 sits in that gap with margin on both sides. Still a stopgap, not a
  # real calibration - see eval/README.md, which needs a much larger golden
  # set before this number should be trusted.
  score_floor: 0.55
  # Pair the dense embedding with a lexical (sparse) one and fuse the two
  # by reciprocal rank. Dense vectors are poor at exact identifiers - a
  # CN code in a large reference table ranked 291st without this. Applies
  # to collections created from now on; an older collection cannot have a
  # sparse vector added in place, see `python -m retrieval.migrate`.
  hybrid: true

storage:
  data_dir: /app/data
  collection: documents_hybrid
  # Points per Qdrant upsert request, for the same reason.
  upsert_batch: 128
