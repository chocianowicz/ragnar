services:
  app:
    build: .
    # Auto-recover if the process is killed (e.g. Docker Desktop VM memory
    # pressure sends SIGKILL -> exit 137). Without this the app stays dead
    # and the browser shows "Is Streamlit still running?". "unless-stopped"
    # revives it on crash and on Docker/host restart, but respects a
    # deliberate `docker compose stop`.
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./:/app
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      HF_TOKEN: ${HF_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
