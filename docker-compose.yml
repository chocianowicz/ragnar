services:
  app:
    build: .
    # Auto-recover if the process is killed (e.g. Docker Desktop VM memory
    # pressure sends SIGKILL -> exit 137). Without this the app stays dead
    # and the browser shows "Is Streamlit still running?". "unless-stopped"
    # revives it on crash and on Docker/host restart, but respects a
    # deliberate `docker compose stop`.
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Bind-mount the whole repo for live code reload during development;
      # this already includes ./data, so no separate data mount is needed.
      - ./:/app
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      HF_TOKEN: ${HF_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  qdrant:
    # Pinned deliberately. The index lives in a named volume with no
    # documented rebuild path (see README, "known gaps"), so a floating tag
    # means a future `docker compose pull` can bring a storage format the
    # existing volume disagrees with — on a tool whose whole premise is
    # running offline and unattended for a small team. Bump on purpose.
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
