services:
  app:
    build: .
    # Auto-recover if the process is killed (e.g. Docker Desktop VM memory
    # pressure sends SIGKILL -> exit 137). Without this the app stays dead
    # and the browser shows "Is Streamlit still running?". "unless-stopped"
    # revives it on crash and on Docker/host restart, but respects a
    # deliberate `docker compose stop`.
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Bind-mount the whole repo for live code reload during development;
      # this already includes ./data, so no separate data mount is needed.
      - ./:/app
      # The reranker weights (~2GB) are pulled from HuggingFace the first
      # time a question is reranked. Without somewhere persistent to put
      # them, every fresh container downloads them again — the README's
      # "one-time download on first run" was once per container, which also
      # means the app is not actually offline-capable until it has been
      # online once, and is why .env.example mentions a rate-limit warning.
      - model_cache:/cache
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /cache/huggingface
      # host_server.py on the Mac, where the reranker and Docling run on the
      # GPU. Docker on macOS cannot reach Metal, so the container would
      # otherwise do both on CPU (~30 min per 300-page book, 10.34s per
      # rerank of 30 candidates, against 1.48s for the same rerank on the
      # host GPU).
      #
      # ${VAR-default}, not ${VAR:-default}: an empty value in .env disables
      # the remote path deliberately (the clients read "" as unset), while an
      # unset one still gets the default. Both clients fall back to
      # in-process CPU when the host service is unreachable, so the app keeps
      # working — just slower — when it is not running.
      PARSER_URL: ${PARSER_URL-http://host.docker.internal:8007}
      RERANKER_URL: ${RERANKER_URL-http://host.docker.internal:8007}
      # Docling's AcceleratorOptions reads this directly (env_prefix
      # "DOCLING_"). Its default is 4 regardless of host size. 8 assumes
      # Docker Desktop's VM has been given at least that many CPUs — check
      # with `docker compose exec app nproc` and match this to what is
      # actually available; asking for more threads than the VM has only adds
      # scheduling overhead. Only affects the in-container fallback path,
      # since a host parse runs in host_server.py instead.
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS-8}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  qdrant:
    # Pinned deliberately. The index lives in a named volume with no
    # documented rebuild path (see README, "known gaps"), so a floating tag
    # means a future `docker compose pull` can bring a storage format the
    # existing volume disagrees with — on a tool whose whole premise is
    # running offline and unattended for a small team. Bump on purpose.
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  model_cache:
